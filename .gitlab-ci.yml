stages:
  - test
  - build
  - release

default:
  interruptible: true

test-client:
  stage: test
  image: golang:1.26.3-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - cd apps/mc-build-updater
    - go test ./...

build-client-release:
  stage: build
  image: golang:1.26.3-bookworm
  needs:
    - test-client
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - cd apps/mc-build-updater
    - mkdir -p release
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$CI_COMMIT_TAG" -o release/mc-build-updater.exe ./cmd/mc-build-updater
    - cd release
    - sha256sum mc-build-updater.exe > checksums.txt
  artifacts:
    paths:
      - apps/mc-build-updater/release/mc-build-updater.exe
      - apps/mc-build-updater/release/checksums.txt
    expire_in: 1 day

release-client:
  stage: release
  image: alpine:3.23
  needs:
    - build-client-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - apk add --no-cache curl
    - test -n "$GITLAB_RELEASE_TOKEN"
    - export PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mc-build-updater/$CI_COMMIT_TAG"
    - curl --fail-with-body --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" --upload-file apps/mc-build-updater/release/mc-build-updater.exe "$PACKAGE_URL/mc-build-updater.exe"
    - curl --fail-with-body --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" --upload-file apps/mc-build-updater/release/checksums.txt "$PACKAGE_URL/checksums.txt"
    - |
      cat > release.json <<EOF
      {"name":"$CI_COMMIT_TAG","tag_name":"$CI_COMMIT_TAG","description":"Automatic Windows client release.","assets":{"links":[{"name":"mc-build-updater.exe","url":"$PACKAGE_URL/mc-build-updater.exe","link_type":"package"},{"name":"checksums.txt","url":"$PACKAGE_URL/checksums.txt","link_type":"package"}]}}
      EOF
    - curl --fail-with-body --request POST --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" --header "Content-Type: application/json" --data @release.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
