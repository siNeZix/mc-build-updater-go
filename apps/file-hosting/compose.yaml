services:
  file-hosting:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc-build-updater/file-hosting:latest
    ports:
      - "1447:1447"
    environment:
      ADDR: ":1447"
      FILES_PATH: /data
      FILE_HOSTING_TOKEN: ${FILE_HOSTING_TOKEN:-}
    user: "0:0"
    volumes:
      - ./files:/data
    restart: unless-stopped
